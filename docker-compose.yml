services:
  service:
    build: ./service
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build: ./gateway
    environment:
      SERVICE_URL: http://service:8000
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      service:
        condition: service_healthy
